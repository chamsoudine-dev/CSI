const L=[["Méthodes censées être proposées (011) / ≥ 3 / ≥ 5",`${p}/9 — ${b(p>=3)} / ${b(p>=5)}`],["Méthodes proposées systématiquement (016) / ≥ 3 / ≥ 5",`${s}/9 — ${b(s>=3)} / ${b(s>=5)}`],["Méthodes en stock le jour de l'enquête (028) / ≥ 3 / ≥ 5",`${st}/9 — ${b(st>=3)} / ${b(st>=5)}`],["Méthodes en rupture aujourd'hui",`<span class="${ru?'ko':'ok'}">${ru}</span>`],["Au moins une rupture sur 3 mois / 6 mois",`${b(r3>0)} / ${b(r6>0)}`],["Médicaments maternels disponibles (020)",`${mv}/17`],["≥ 7 médicaments vitaux dont sulfate de magnésium + ocytocine",b(okm)]];
h=`<div class="card"><b>Synthèse – ${esc(cur.n)}</b> (${total(cur)}% rempli)${L.map(x=>`<div class="sy"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')}</div>`}
const all=[];S.forEach(s=>s.q.forEach(q=>keys(q).forEach(k=>all.push(k))));
const csv=['code;csi;district;date;enquêteur;complété_%;'+all.join(';')].concat(DB.map(r=>[r.c,r.n,r.d,r.dt,r.e,total(r)].concat(all.map(k=>{const v=r.a[k];return Array.isArray(v)?v.join(' | '):(v??'')})).map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';'))).join('\n');
$('#u26-app').innerHTML=h+`<div class="card"><b>Export CSV (toutes les enquêtes)</b><div class="note">Copiez puis collez dans Excel (séparateur « ; »). Les données sont stockées sur cet appareil : exportez régulièrement.</div><textarea id="u26csv" rows="8" readonly>${esc(csv)}</textarea><p><button class="btn" data-act="copy">Copier le CSV</button></p></div><div class="card"><b>Sauvegarde / restauration (JSON)</b><div class="note">Pour transférer les enquêtes d'un appareil à un autre ou les récupérer après effacement du navigateur.</div><textarea id="u26js" rows="4">${esc(JSON.stringify(DB))}</textarea><p><button class="btn s" data-act="cj">Copier la sauvegarde</button> <button class="btn s" data-act="ij">Restaurer depuis ce texte</button></p></div>`}
function go(t){tab=t;tabs();({plan,form,syn})[t]()}
root.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
if(d.tab)return go(d.tab);
if(d.sec!==undefined){si=+d.sec;return form()}
if(d.act=='add'){const g=i=>$('#u26'+(i=='pt'?'pt0':i)).value.trim();if(!g('pn')&&!g('pc'))return alert('Saisissez au moins le nom ou le code du CSI');DB.push({id:Date.now(),c:g('pc'),n:g('pn'),d:g('pd'),e:g('pe'),dt:g('pt'),a:{"001":g('pn'),dis:g('pd'),enq:g('pe'),dat:g('pt')}});save();return plan()}
if(d.act=='open'){cur=DB.find(r=>r.id==d.id);si=0;return go('form')}
if(d.act=='del'){if(confirm('Supprimer cette enquête ?')){DB=DB.filter(r=>r.id!=d.id);if(cur&&cur.id==+d.id)cur=null;save();plan()}return}
if(d.act=='prev'){si=Math.max(0,si-1);form();root.scrollIntoView()}
if(d.act=='next'){si=Math.min(S.length-1,si+1);form();root.scrollIntoView()}
if(d.act=='cj'){const x=$('#u26js');x.select();try{navigator.clipboard.writeText(x.value)}catch(_){document.execCommand('copy')}t.textContent='Copié ✓'}
if(d.act=='ij'){try{const j=JSON.parse($('#u26js').value);if(Array.isArray(j)&&confirm('Remplacer les données actuelles ?')){DB=j;cur=null;save();go('plan')}}catch(_){alert('Texte JSON invalide')}}
if(d.act=='copy'){const x=$('#u26csv');x.select();try{navigator.clipboard.writeText(x.value)}catch(_){document.execCommand('copy')}t.textContent='Copié ✓'}});
function upd(e){const el=e.target,k=el.dataset.k;if(!k||!cur)return;
if(el.dataset.t=='checkbox')cur.a[k]=[...root.querySelectorAll(`input[data-k="${k}"]:checked`)].map(x=>x.value);
else if(el.dataset.t=='radio'){if(!el.checked)return;cur.a[k]=el.value}else cur.a[k]=el.value;
if(k=='001')cur.n=el.value;save();chips();hdr()}
root.addEventListener('input',upd);root.addEventListener('change',upd);
go('plan');
})();
</script>
