<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSI NIGER — Système National de Surveillance Sanitaire</title>
<link rel="icon" type="image/webp" href="/img/logo.webp">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<!-- HTMX & Alpine.js -->
<script src="https://unpkg.com/htmx.org@1.9.10"></script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

<!-- Thème Flutter — Blanc/Bleu — surcharge le style par défaut -->
<link rel="stylesheet" href="/flutter-theme.css">

<link rel="stylesheet" href="/css/app.css">

<!-- ── SURCHARGES LAYOUT FLUTTER — priorité maximale ── -->

</head>
<body>


<!-- ======================================================================= -->
<!-- ÉCRAN 2 : APPLICATION MÉTIER PRINCIPALE (AFFICHÉE APRÈS CONNEXION)       -->
<!-- ======================================================================= -->
<div id="app-screen">

  <!-- ── HEADER FIXE (pleine largeur) ── -->
  <header>
    <div class="brand" onclick="navigateView('tb')">
      <img src="/img/logo.png" alt="Logo MS/HP Niger" class="brand-logo">
      <div class="brand-title-group">
        <h1>
          CSI NIGER
          <span class="brand-badge">MS / HP</span>
        </h1>
        <span class="brand-subtitle">Ministère de la Santé et de l'Hygiène Publique</span>
      </div>
    </div>

    <div class="header-right">
      <div class="user-info hid" id="user-info"></div>
      <button class="btn btn-ghost btn-sm" id="sidebar-toggle" title="Réduire / Déployer le menu latéral" style="font-size:0.84rem">☰ Menu</button>
      <button class="btn btn-ghost btn-sm" id="fullscreen-toggle" title="Basculer en Plein Écran" style="font-size:0.84rem">⛶ Plein écran</button>
      <button class="btn btn-ghost btn-sm" id="theme-toggle" title="Basculer le thème">🌓</button>
      <button class="btn btn-ghost btn-sm" id="auth-btn" title="Quitter la session">🚪 Déconnexion</button>
    </div>
  </header>

  <!-- ── SIDEBAR VERTICALE ── -->
  <nav id="nav">
    <button hx-get="/api/dashboard/view" hx-target="#tb" class="on">📊 <span class="nav-label">Tableau de bord</span></button>
    <button hx-get="/api/patients/view" hx-target="#patients">🧑‍⚕️ <span class="nav-label">Dossier & Patients</span></button>
    <button hx-get="/api/csi/view" hx-target="#liste">📋 <span class="nav-label">Registre des CSI</span></button>
    <button hx-get="/api/catalogue/view" hx-target="#catalogue">💊 <span class="nav-label">Catalogue</span></button>
    <button hx-get="/api/missions/view" hx-target="#enquete" id="nav-enquete">🧭 <span class="nav-label">Missions</span></button>
    <button hx-get="/api/ravitaillement/view" hx-target="#ravitaillement">🚚 <span class="nav-label">Ravitaillement</span></button>
    <button hx-get="/api/maternite/view" hx-target="#maternite">👶 <span class="nav-label">Maternité</span></button>
    <button hx-get="/api/unfpa/view" hx-target="#unfpa">📋 <span class="nav-label">UNFPA</span></button>
    <button hx-get="/api/alertes/view" hx-target="#alertes">🚨 <span class="nav-label">Alertes</span></button>
    <button hx-get="/api/admin/view" hx-target="#utilisateurs">👥 <span class="nav-label">Utilisateurs</span></button>
    <button hx-get="/api/logs/view" hx-target="#logs">📋 <span class="nav-label">Logs Système</span></button>
    <button hx-get="/api/api-docs/view" hx-target="#api-docs">📚 <span class="nav-label">Doc API</span></button>
    <button hx-get="/api/parametres/view" hx-target="#parametres">⚙️ <span class="nav-label">Paramètres</span></button>
  </nav>

  <!-- ── CONTENU PRINCIPAL (décalé à droite de la sidebar) ── -->
  <main>
    <div id="msg-zone">
      <button hx-get="/api/test-htmx" hx-target="#msg-zone">Tester HTMX</button>
    </div>
    <section id="tb"></section>
    <section id="patients" class="hid"></section>
    <section id="liste" class="hid"></section>
    <section id="carte" class="hid"></section>
    <section id="saisie" class="hid"></section>
    <section id="enquete" class="hid"></section>
    <section id="catalogue" class="hid"></section>
    <section id="ravitaillement" class="hid"></section>
    <section id="stock" class="hid"></section>
    <section id="maternite" class="hid"></section>
    <section id="alertes" class="hid"></section>
    <section id="utilisateurs" class="hid"></section>
    <section id="audit" class="hid"></section>
    <section id="parametres" class="hid"></section>
    <section id="motdepasse" class="hid"></section>
    <section id="unfpa" class="hid"></section>
    <section id="logs" class="hid"></section>
    <section id="api-docs" class="hid"></section>
  </main>

</div>

<!-- Dialog de confirmation générique -->
<dialog id="dlg-confirm">
  <div class="dlg-header">
    <strong id="confirm-title" style="font-size:1.05rem">Confirmation</strong>
  </div>
  <div class="dlg-body">
    <p id="confirm-msg" style="color:var(--text-muted);font-size:0.92rem"></p>
  </div>
  <div class="dlg-footer">
    <button class="btn btn-secondary" id="confirm-no">Annuler</button>
    <button class="btn btn-primary" id="confirm-yes">Confirmer</button>
  </div>
</dialog>

<script src="/js/app.js"></script>
</body>
</html>
