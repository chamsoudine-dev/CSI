# ─────────────────────────────────────────────────────────────────────────────
# CSI NIGER — Docker Compose (Production)
# Lance : PostgreSQL 16 + Serveur Node.js + Adminer (optionnel)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Base de données PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: csi_niger_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-csi_niger}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Erreur: La variable POSTGRES_PASSWORD est obligatoire dans le fichier .env}
    volumes:
      # Persistance des données entre les redémarrages
      - postgres_data:/var/lib/postgresql/data
    # Port 5432 exposé uniquement avec le profil "dev" (ex: docker compose --profile dev up)
    ports:
      - "5432:5432"
    profiles:
      - dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-csi_niger}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - csi_network

  # ── Application Node.js (API + Frontend) ───────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: csi_niger_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV:          production
      PORT:              ${PORT:-3000}
      # URL de connexion PostgreSQL (pointe vers le service "db")
      DATABASE_URL:      postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Erreur: POSTGRES_PASSWORD requis}@db:5432/${POSTGRES_DB:-csi_niger}
      DATABASE_SSL:      "false"
      TRUST_PROXY:       ${TRUST_PROXY:-1}
      JWT_SECRET:        ${JWT_SECRET:?Erreur: La variable JWT_SECRET est obligatoire dans le fichier .env}
      JWT_EXPIRES:       ${JWT_EXPIRES:-8h}
      ADMIN_EMAIL:       ${ADMIN_EMAIL:-admin@csi-niger.ne}
      ADMIN_PASSWORD:    ${ADMIN_PASSWORD:?Erreur: La variable ADMIN_PASSWORD est obligatoire dans le fichier .env}
      ADMIN_NOM:         ${ADMIN_NOM:-Administrateur National}
      SEED_DEMO:         ${SEED_DEMO:-false}
      ALLOWED_ORIGINS:   ${ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL:         ${LOG_LEVEL:-info}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - app_logs:/app/logs
    networks:
      - csi_network

  # ── Adminer : Interface graphique PostgreSQL (optionnelle) ──────────────────
  adminer:
    image: adminer:latest
    container_name: csi_niger_adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
    networks:
      - csi_network
    profiles:
      # Activé uniquement avec : docker compose --profile admin up
      - admin

# ── Volumes nommés ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: csi_niger_postgres_data
  app_logs:
    name: csi_niger_app_logs

# ── Réseau interne isolé ───────────────────────────────────────────────────────
networks:
  csi_network:
    name: csi_niger_network
    driver: bridge
